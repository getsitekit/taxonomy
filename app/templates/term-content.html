<form class="uk-form uk-form-stacked" v-validator="form" @submit="saveTerm(edit) | valid">
    <div class="uk-modal-header">
        <h2>{{ 'taxonomy.admin.edit' | trans }} {{ taxonomy.label_single }}</h2>
    </div>

    <div class="uk-grid sk-grid-large sk-width-sidebar-large" data-uk-grid-margin>
        <div class="sk-width-content">

            <div class="uk-form-row">
                <label for="form-title" class="uk-form-label">{{ 'taxonomy.admin.title' | trans }}</label>
                <div class="uk-form-controls">
                    <input id="form-title" class="uk-width-1-1 uk-form-large" name="title" type="text"
                           v-model="edit.title" v-validate:required>
                    <p class="uk-form-help-block uk-text-danger" v-show="form.title.invalid">
                        {{ 'taxonomy.admin.invalid_title' | trans }}</p>
                </div>
            </div>

            <div class="uk-form-row">
                <v-editor :value.sync="edit.data.content" :options="{markdown : edit.data.markdown}"></v-editor>
            </div>
        </div>
        <div class="sk-width-sidebar">

            <div class="uk-form-row">
                <label for="form-image" class="uk-form-label">{{ 'taxonomy.admin.image' | trans }}</label>
                <div class="uk-form-controls">
                    <input-image-meta :image.sync="edit.data.image" class="sk-image-max-height"></input-image-meta>
                </div>
            </div>

            <div class="uk-form-row">
                <label for="form-slug" class="uk-form-label">{{ 'taxonomy.admin.slug' | trans }}</label>

                <div class="uk-form-controls">
                    <input id="form-slug" class="uk-width-1-1" type="text" v-model="edit.slug">
                </div>
            </div>

            <div class="uk-form-row">
                <label for="form-status" class="uk-form-label">{{ 'taxonomy.admin.status' | trans }}</label>
                <div class="uk-form-controls">
                    <select id="form-status" class="uk-width-1-1" v-model="edit.status">
                        <option v-for="status in config.statuses" :value="$key">{{ status | trans }}</option>
                    </select>
                </div>
            </div>

            <div class="uk-form-row">
                <span class="uk-form-label">{{ 'taxonomy.admin.options' | trans }}</span>
                <div class="uk-form-controls">
                    <label><input type="checkbox" v-model="edit.data.markdown"
                                  value="1"> {{ 'taxonomy.admin.enable_markdown' | trans }}</label>
                </div>
            </div>

        </div>
    </div>

    <div class="uk-modal-footer uk-text-right">
        <button class="uk-button uk-button-link uk-modal-close" type="button">{{ 'taxonomy.admin.cancel' | trans }}</button>
        <button class="uk-button uk-button-primary" :disabled="form.invalid || !edit.title">{{ 'taxonomy.admin.save' | trans }}
        </button>
    </div>

</form>
