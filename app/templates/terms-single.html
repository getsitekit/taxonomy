<div>

        <div v-if="taxonomy" class="uk-margin uk-flex uk-flex-space-between uk-flex-wrap" data-uk-margin>
            <div class="uk-flex uk-flex-middle uk-flex-wrap" data-uk-margin>

                <h2 class="uk-margin-remove">{{ taxonomy.label_plural | trans }}</h2>

                <div class="uk-margin-left" v-show="selected.length">
                    <ul class="uk-subnav sk-subnav-icon">
                        <li><a class="sk-icon-check sk-icon-hover" :title="$trans('taxonomy.admin.publish')"
                               data-uk-tooltip="{delay: 500}" @click="status(1)"></a></li>
                        <li><a class="sk-icon-block sk-icon-hover" :title="$trans('taxonomy.admin.unpublish')"
                               data-uk-tooltip="{delay: 500}" @click="status(0)"></a></li>
                        <li><a class="sk-icon-delete sk-icon-hover" :title="'taxonomy.admin.delete' | trans"
                               data-uk-tooltip="{delay: 500}" @click.prevent="remove"
                               v-if="true" v-confirm="'taxonomy.admin.delete_terms' | trans"></a>
                        </li>
                    </ul>
                </div>

                <div class="sk-search">
                    <div class="uk-search">
                        <input class="uk-search-field" type="text" v-model="config.filter.search" debounce="300">
                    </div>
                </div>

            </div>
            <div class="uk-position-relative" data-uk-margin>

                <div>
                    <button type="button" class="uk-button uk-button-primary" @click="editTerm()">
                    {{ 'taxonomy.admin.add' | trans }} {{ taxonomy.label_single | trans }}</button>
                </div>

            </div>
        </div>

        <div v-if="taxonomy" class="uk-overflow-container uk-form">
            <table class="uk-table uk-table-hover uk-table-middle">
                <thead>
                    <tr>
                        <th class="sk-table-width-minimum"><input type="checkbox" v-check-all:selected.literal="input[name=id]" number></th>
                        <th class="sk-table-min-width-200" v-order:title="config.filter.order">{{ 'taxonomy.admin.title' | trans }}</th>
                        <th class="sk-table-width-100 uk-text-center">
                            <input-filter :title="$trans('taxonomy.admin.status')" :value.sync="config.filter.status" :options="statusOptions"></input-filter>
                        </th>
                        <th class="sk-table-width-100">{{ 'taxonomy.admin.items_count' | trans }}</th>
                        <th class="sk-table-width-150">{{ 'taxonomy.admin.url' | trans }}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="check-item" v-for="term in terms" :class="{'uk-active': active(term)}">
                        <td><input type="checkbox" name="id" :value="term.id" number></td>
                        <td>
                            <a @click="editTerm(term)">{{ term.title }}</a><br/>
                            <small class="uk-text-muted">{{ term.slug }}</small>
                        </td>
                        <td class="uk-text-center">
                            <a title="{{ getStatusText(term) }}" :class="{
                                'sk-icon-circle-danger': term.status === 0,
                                'sk-icon-circle-success': term.status === 1
                            }" @click="toggleStatus(term)"></a>
                        </td>
                        <td class="uk-text-center">
                            #
                        </td>
                        <td class="sk-table-text-break">
                            <a v-if="term.url" :href="$url.route(term.url)" target="_blank">{{ term.url }}</a>
                            <span v-else>{{ term.link }}</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h3 class="uk-h1 uk-text-muted uk-text-center" v-show="terms && !terms.length">
        {{ 'taxonomy.admin.no_terms' | trans }}</h3>

        <v-pagination :page.sync="config.page" :pages="pages" v-show="pages > 1"></v-pagination>

        <v-modal v-ref:form large>
            <partial :name="taxonomy.options.term_type"></partial>
        </v-modal>

    </div>
